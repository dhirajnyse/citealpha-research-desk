    <text x="0" y="114" fill="#101816" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="900">CiteAlpha</text>
    <text x="0" y="170" fill="#263230" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="800">Ask filings. See the evidence.</text>
    <text x="0" y="228" fill="#53625E" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">Evidence-backed equity research across SEC filings,</text>
    <text x="0" y="264" fill="#53625E" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">earnings calls, and valuation scenarios.</text>
    <g transform="translate(0 324)">
