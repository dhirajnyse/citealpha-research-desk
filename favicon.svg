      <text x="20" y="32" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Cited answers</text>
      <rect x="184" y="0" width="148" height="50" rx="10" fill="#F7FAF9" stroke="#CAD7D3"/>
      <text x="204" y="32" fill="#263230" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">SEC filings</text>
      <rect x="350" y="0" width="174" height="50" rx="10" fill="#F7FAF9" stroke="#CAD7D3"/>
      <text x="370" y="32" fill="#263230" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Valuation lens</text>
    </g>
